name: sync-index-to-web

# index/index.json 变更时，把索引同步到市场页 web/index.json（同仓库，无需 PAT）。
# 相比旧的跨仓库 sync-to-web.yml：不再 clone ModPack-Web、不再需要 MODPACK_WEB_TOKEN，
# 用 GITHUB_TOKEN + contents:write 直接回写本仓库；回写产生的 push 由静态托管自动部署。

on:
  push:
    branches: [main]
    paths:
      - 'index/index.json'
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write   # 同仓库回写 web/index.json

concurrency:
  group: sync-index-to-web
  cancel-in-progress: false   # 串行执行，避免两次 push 交错覆盖

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 先过一遍契约校验：不合法就不往市场页同步
      - name: 校验 index/index.json
        run: npx -y modpack-cli@latest index validate index/index.json

      - name: 同步 index/index.json → web/index.json
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          cp index/index.json web/index.json

          git add web/index.json
          if git diff --cached --quiet; then
            echo "web/index.json 与 index/index.json 一致，跳过提交"
            exit 0
          fi

          git commit -m "chore: sync web/index.json from index/index.json@${GITHUB_SHA}"
          git push