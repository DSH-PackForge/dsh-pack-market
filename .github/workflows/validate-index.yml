name: validate-index

on:
  pull_request:
    paths:
      - 'index/index.json'
  push:
    branches: [main]
    paths:
      - 'index/index.json'

jobs:
  validate-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 校验 index/index.json（modpack-cli 契约校验）
        run: npx -y modpack-cli@latest index validate index/index.json