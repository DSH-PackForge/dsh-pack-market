name: validate-index

on:
  pull_request:
    paths:
      - 'index/index.json'
  push:
    branches: [main]
    paths:
      - 'index/index.json'

jobs:
  validate-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 校验 index/index.json 是合法 JSON（临时：modpack-cli 尚未发布 index 命令，暂只查 JSON 合法性）
        run: node -e "JSON.parse(require('fs').readFileSync('index/index.json','utf8')); console.log('✓ index/index.json 是合法 JSON')"