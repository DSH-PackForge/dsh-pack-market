    <div class="hero-art" aria-hidden="true">

        <defs>
          <radialGradient id="haGlow" cx="50%" cy="50%" r="55%">

          <linearGradient id="haTop" x1="0.15" y1="0" x2="0.85" y2="1">

            <stop class="ha-top-s2" offset="100%"/>

        <!-- 生态轨道：虚线圆环 + 一粒朱砂点（同心，点恰好走在环上） -->

          <circle class="ha-ring" cx="130" cy="110" r="96" fill="none" stroke-width="1" stroke-dasharray="3 7"/>
          <circle class="ha-node" cx="226" cy="110" r="3.5"/>

        <ellipse class="ha-shadow" cx="130" cy="176" rx="82" ry="8"/>

          <path class="ha-face ha-face-top" d="M130 53 L216 96 L130 139 L44 96 Z" fill="url(#haTop)"/>

        <circle class="ha-speck ha-speck-1" cx="74" cy="72" r="2"/>
        <circle class="ha-speck ha-speck-2" cx="196" cy="64" r="1.6"/>
